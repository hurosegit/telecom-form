<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kt M mobile 공식 서식지 타이핑 시스템</title>
    <!-- 고화질 JPG 추출 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', '맑은 고딕', sans-serif; }
        body { margin: 0; padding: 15px; background-color: #2b2d31; color: #fff; }
        
        .header-bar { max-width: 1500px; margin: 0 auto 15px; background: #ea1d25; padding: 12px 20px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .header-bar h1 { margin: 0; font-size: 18px; font-weight: 800; }

        .main-layout { display: flex; gap: 20px; max-width: 1500px; margin: 0 auto; }

        /* 좌측: 타이핑 입력 패널 */
        .typing-panel { flex: 0.9; background: #fff; color: #222; padding: 20px; border-radius: 8px; max-height: 92vh; overflow-y: auto; }
        .panel-title { font-size: 14px; font-weight: bold; color: #ea1d25; border-bottom: 2px solid #ea1d25; padding-bottom: 5px; margin: 15px 0 10px 0; }
        .panel-title:first-of-type { margin-top: 0; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #555; }
        .form-group input, .form-group select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }

        /* 서식지 이미지 파일 선택 버튼 */
        .file-upload-box { background: #fff3f3; border: 1px dashed #ea1d25; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 12px; color: #333; }

        /* 버튼 그룹 */
        .action-btns { display: flex; gap: 8px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-jpg { background: #008080; color: #fff; }
        .btn-print { background: #333; color: #fff; }
        .btn-reset { background: #777; color: #fff; flex: 0.4; }

        /* 우측: A4 서식지 오버레이 Canvas */
        .preview-panel { flex: 1.1; background: #1e1f22; padding: 15px; border-radius: 8px; display: flex; justify-content: center; overflow-x: auto; }
        
        /* A4 규격 레이아웃 (가로 800px 고정 기준 좌표 계산) */
        .paper-canvas { position: relative; width: 800px; height: 1130px; background-color: #fff; background-size: 100% 100%; background-repeat: no-repeat; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        
        /* 오버레이 텍스트 공통 스타일 */
        .overlay-field { position: absolute; font-size: 13px; font-weight: bold; color: #000dff; white-space: nowrap; pointer-events: none; }
        
        /* ========================================================= */
        /* [중요] kt M mobile 공식 서식지 빈칸 위치 좌표 (PX 단위)    */
        /* 서식지 이미지 스캔 상태에 따라 아래 px 값만 조절하면 됩니다. */
        /* ========================================================= */
        #pos_name       { top: 142px; left: 130px; } /* 고객명 */
        #pos_rrn        { top: 142px; left: 450px; } /* 주민번호 */
        #pos_phone      { top: 178px; left: 130px; } /* 희망/개통번호 */
        #pos_subPhone   { top: 178px; left: 450px; } /* 비상연락처 */
        #pos_address    { top: 214px; left: 130px; } /* 주소 */
        #pos_idType     { top: 250px; left: 130px; } /* 신분증종류 */
        #pos_idDate     { top: 250px; left: 450px; } /* 발급일자/면허번호 */

        #pos_joinType   { top: 340px; left: 130px; } /* 가입유형 */
        #pos_contract   { top: 340px; left: 450px; } /* 약정조건 */
        #pos_model      { top: 376px; left: 130px; } /* 모델명 */
        #pos_serial     { top: 376px; left: 450px; } /* 일련번호 */
        #pos_usim       { top: 412px; left: 130px; } /* USIM번호 */
        #pos_plan       { top: 448px; left: 130px; } /* 요금제 */
        #pos_addon      { top: 484px; left: 130px; } /* 부가서비스 */

        #pos_payMethod  { top: 575px; left: 130px; } /* 납부방식 */
        #pos_bankName   { top: 575px; left: 450px; } /* 금융사명 */
        #pos_payNum     { top: 611px; left: 130px; } /* 계좌/카드번호 */
        #pos_payOwner   { top: 611px; left: 450px; } /* 예금주 */

        #pos_date       { top: 980px; left: 320px; font-size: 14px; } /* 신청일자 */
        #pos_signName   { top: 1020px; left: 520px; font-size: 15px; } /* 서명란 이름 */

        @media print {
            body { padding: 0; background: #fff; }
            .header-bar, .typing-panel, .action-btns { display: none !important; }
            .preview-panel { padding: 0; background: #fff; }
            .paper-canvas { box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="header-bar">
    <h1>📱 kt M mobile 공식 서식지 타이핑 시스템</h1>
    <span>공식 이미지 좌표 오버레이 방식</span>
</div>

<div class="main-layout">
    <!-- 좌측 타이핑 입력창 -->
    <div class="typing-panel">
        <div class="file-upload-box">
            <b>📂 서식지 이미지 교체 (선택):</b><br>
            엑셀에서 추출한 엠모바일 공식 서식지 JPG 파일이 있다면 아래에서 선택하세요.<br>
            <input type="file" id="bgUploader" accept="image/*" onchange="loadCustomBackground(this)" style="margin-top:5px;">
        </div>

        <div class="panel-title">1. 고객 기본 정보</div>
        <div class="form-grid">
            <div class="form-group">
                <label>고객명</label>
                <input type="text" id="in_name" placeholder="홍길동" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>주민등록번호 (전체)</label>
                <input type="text" id="in_rrn" placeholder="900101-1******" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>개통 희망번호</label>
                <input type="text" id="in_phone" placeholder="010-1234-5678" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>비상 연락처</label>
                <input type="text" id="in_subPhone" placeholder="010-9876-5432" oninput="renderOverlay()">
            </div>
            <div class="form-group full">
                <label>주민등록상 주소</label>
                <input type="text" id="in_address" placeholder="서울특별시 강남구 테헤란로 123" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>신분증 종류</label>
                <select id="in_idType" onchange="renderOverlay()">
                    <option value="주민등록증">주민등록증</option>
                    <option value="운전면허증">운전면허증</option>
                    <option value="여권">여권</option>
                    <option value="외국인등록증">외국인등록증</option>
                </select>
            </div>
            <div class="form-group">
                <label>발급일자 / 면허번호</label>
                <input type="text" id="in_idDate" placeholder="2022.05.20 / 서울-12-123456" oninput="renderOverlay()">
            </div>
        </div>

        <div class="panel-title">2. 단말기 및 개통 정보</div>
        <div class="form-grid">
            <div class="form-group">
                <label>가입유형</label>
                <select id="in_joinType" onchange="renderOverlay()">
                    <option value="신규가입">신규가입</option>
                    <option value="번호이동(MNP)">번호이동(MNP)</option>
                    <option value="기기변경">기기변경</option>
                </select>
            </div>
            <div class="form-group">
                <label>모델명</label>
                <input type="text" id="in_model" placeholder="SM-S921N (S24)" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>단말 일련번호</label>
                <input type="text" id="in_serial" placeholder="1234567" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>USIM 번호</label>
                <input type="text" id="in_usim" placeholder="M8000-123456" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>약정유형</label>
                <select id="in_contract" onchange="renderOverlay()">
                    <option value="무약정">무약정</option>
                    <option value="24개월 선택약정">24개월 선택약정</option>
                    <option value="24개월 공시약정">24개월 공시약정</option>
                </select>
            </div>
            <div class="form-group">
                <label>요금제명</label>
                <input type="text" id="in_plan" placeholder="모두다 맘껏 11GB+" oninput="renderOverlay()">
            </div>
            <div class="form-group full">
                <label>부가서비스</label>
                <input type="text" id="in_addon" placeholder="통화대기, 데이터안심차단" oninput="renderOverlay()">
            </div>
        </div>

        <div class="panel-title">3. 요금 납부 정보</div>
        <div class="form-grid">
            <div class="form-group">
                <label>납부수단</label>
                <select id="in_payMethod" onchange="renderOverlay()">
                    <option value="은행 계좌이체">은행 계좌이체</option>
                    <option value="신용카드 결제">신용카드 결제</option>
                </select>
            </div>
            <div class="form-group">
                <label>금융사 / 카드사</label>
                <input type="text" id="in_bankName" placeholder="NH농협은행 / 삼성카드" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>계좌번호 / 카드번호</label>
                <input type="text" id="in_payNum" placeholder="302-1234-5678-01" oninput="renderOverlay()">
            </div>
            <div class="form-group">
                <label>예금주명</label>
                <input type="text" id="in_payOwner" placeholder="홍길동" oninput="renderOverlay()">
            </div>
        </div>

        <div class="action-btns">
            <button class="btn btn-jpg" onclick="downloadJPG()">📸 서식지 JPG 저장</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ A4 인쇄</button>
            <button class="btn btn-reset" onclick="resetForm()">🔄 초기화</button>
        </div>
    </div>

    <!-- 우측: 서식지 이미지 + 오버레이 레이어 -->
    <div class="preview-panel">
        <div class="paper-canvas" id="paperCanvas">
            <!-- 실시간 오버레이 필드 (CSS 좌표값에 의해 위치 결정) -->
            <div class="overlay-field" id="pos_name"></div>
            <div class="overlay-field" id="pos_rrn"></div>
            <div class="overlay-field" id="pos_phone"></div>
            <div class="overlay-field" id="pos_subPhone"></div>
            <div class="overlay-field" id="pos_address"></div>
            <div class="overlay-field" id="pos_idType"></div>
            <div class="overlay-field" id="pos_idDate"></div>

            <div class="overlay-field" id="pos_joinType"></div>
            <div class="overlay-field" id="pos_contract"></div>
            <div class="overlay-field" id="pos_model"></div>
            <div class="overlay-field" id="pos_serial"></div>
            <div class="overlay-field" id="pos_usim"></div>
            <div class="overlay-field" id="pos_plan"></div>
            <div class="overlay-field" id="pos_addon"></div>

            <div class="overlay-field" id="pos_payMethod"></div>
            <div class="overlay-field" id="pos_bankName"></div>
            <div class="overlay-field" id="pos_payNum"></div>
            <div class="overlay-field" id="pos_payOwner"></div>

            <div class="overlay-field" id="pos_date"></div>
            <div class="overlay-field" id="pos_signName"></div>
        </div>
    </div>
</div>

<script>
    // 오늘 날짜 설정
    const today = new Date();
    const dateStr = `${today.getFullYear()}년 ${String(today.getMonth()+1).padStart(2,'0')}월 ${String(today.getDate()).padStart(2,'0')}일`;

    // 서식지 기본 배경 이미지 (SVG 원본 양식 기본 탑재)
    const defaultFormBg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1130" viewBox="0 0 800 1130"><rect width="800" height="1130" fill="%23ffffff"/><text x="40" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="%23ea1d25">kt M mobile 개통 신청서 (공식서식 양식)</text><line x1="40" y1="80" x2="760" y2="80" stroke="%23ea1d25" stroke-width="3"/><rect x="40" y="110" width="720" height="170" fill="none" stroke="%23333" stroke-width="1.5"/><line x1="40" y1="145" x2="760" y2="145" stroke="%23ccc"/><line x1="40" y1="181" x2="760" y2="181" stroke="%23ccc"/><line x1="40" y1="217" x2="760" y2="217" stroke="%23ccc"/><text x="50" y="135" font-family="sans-serif" font-size="12" fill="%23666">신청인명</text><text x="370" y="135" font-family="sans-serif" font-size="12" fill="%23666">주민번호</text><text x="50" y="171" font-family="sans-serif" font-size="12" fill="%23666">개통번호</text><text x="370" y="171" font-family="sans-serif" font-size="12" fill="%23666">비상연락처</text><text x="50" y="207" font-family="sans-serif" font-size="12" fill="%23666">주소</text><text x="50" y="243" font-family="sans-serif" font-size="12" fill="%23666">신분증</text><text x="370" y="243" font-family="sans-serif" font-size="12" fill="%23666">발급일자</text><rect x="40" y="310" width="720" height="210" fill="none" stroke="%23333" stroke-width="1.5"/><line x1="40" y1="345" x2="760" y2="345" stroke="%23ccc"/><line x1="40" y1="381" x2="760" y2="381" stroke="%23ccc"/><line x1="40" y1="417" x2="760" y2="417" stroke="%23ccc"/><line x1="40" y1="453" x2="760" y2="453" stroke="%23ccc"/><text x="50" y="333" font-family="sans-serif" font-size="12" fill="%23666">가입유형</text><text x="370" y="333" font-family="sans-serif" font-size="12" fill="%23666">약정조건</text><text x="50" y="369" font-family="sans-serif" font-size="12" fill="%23666">모델명</text><text x="370" y="369" font-family="sans-serif" font-size="12" fill="%23666">일련번호</text><text x="50" y="405" font-family="sans-serif" font-size="12" fill="%23666">USIM번호</text><text x="50" y="441" font-family="sans-serif" font-size="12" fill="%23666">요금제</text><text x="50" y="477" font-family="sans-serif" font-size="12" fill="%23666">부가서비스</text><rect x="40" y="545" width="720" height="100" fill="none" stroke="%23333" stroke-width="1.5"/><line x1="40" y1="580" x2="760" y2="580" stroke="%23ccc"/><text x="50" y="568" font-family="sans-serif" font-size="12" fill="%23666">납부수단</text><text x="370" y="568" font-family="sans-serif" font-size="12" fill="%23666">금융사</text><text x="50" y="604" font-family="sans-serif" font-size="12" fill="%23666">계좌/카드번호</text><text x="370" y="604" font-family="sans-serif" font-size="12" fill="%23666">예금주</text><rect x="40" y="670" width="720" height="230" fill="%23fafafa" stroke="%23aaa" stroke-width="1"/><text x="55" y="695" font-family="sans-serif" font-size="12" font-weight="bold" fill="%23333">[개통 약관 및 동의사항]</text><text x="55" y="725" font-family="sans-serif" font-size="11" fill="%23555">1. 본 서식지는 kt M mobile 이동전화 서비스 가입을 위한 정식 개통 신청서입니다.</text><text x="55" y="750" font-family="sans-serif" font-size="11" fill="%23555">2. 제공받은 개인정보는 이동전화 개통 및 요금 청구 목적으로만 활용됩니다.</text><text x="220" y="975" font-family="sans-serif" font-size="13" fill="%23333">신청일자:</text><text x="390" y="1015" font-family="sans-serif" font-size="14" font-weight="bold" fill="%23111">신청인(서명):</text></svg>`;

    const canvas = document.getElementById('paperCanvas');
    canvas.style.backgroundImage = `url('${defaultFormBg}')`;

    // 사용자 커스텀 서식지 이미지 업로드 처리
    function loadCustomBackground(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                canvas.style.backgroundImage = `url('${e.target.result}')`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 데이터 오버레이 렌더링
    function renderOverlay() {
        document.getElementById('pos_name').innerText = document.getElementById('in_name').value;
        document.getElementById('pos_rrn').innerText = document.getElementById('in_rrn').value;
        document.getElementById('pos_phone').innerText = document.getElementById('in_phone').value;
        document.getElementById('pos_subPhone').innerText = document.getElementById('in_subPhone').value;
        document.getElementById('pos_address').innerText = document.getElementById('in_address').value;
        document.getElementById('pos_idType').innerText = document.getElementById('in_idType').value;
        document.getElementById('pos_idDate').innerText = document.getElementById('in_idDate').value;

        document.getElementById('pos_joinType').innerText = document.getElementById('in_joinType').value;
        document.getElementById('pos_contract').innerText = document.getElementById('in_contract').value;
        document.getElementById('pos_model').innerText = document.getElementById('in_model').value;
        document.getElementById('pos_serial').innerText = document.getElementById('in_serial').value;
        document.getElementById('pos_usim').innerText = document.getElementById('in_usim').value;
        document.getElementById('pos_plan').innerText = document.getElementById('in_plan').value;
        document.getElementById('pos_addon').innerText = document.getElementById('in_addon').value;

        document.getElementById('pos_payMethod').innerText = document.getElementById('in_payMethod').value;
        document.getElementById('pos_bankName').innerText = document.getElementById('in_bankName').value;
        document.getElementById('pos_payNum').innerText = document.getElementById('in_payNum').value;
        document.getElementById('pos_payOwner').innerText = document.getElementById('in_payOwner').value;

        document.getElementById('pos_date').innerText = dateStr;
        document.getElementById('pos_signName').innerText = document.getElementById('in_name').value;
    }

    // JPG 이미지 다운로드
    function downloadJPG() {
        const name = document.getElementById('in_name').value || '고객';
        html2canvas(canvas, {
            scale: 2, // 고해상도 캡처
            useCORS: true,
            backgroundColor: '#ffffff'
        }).then(cvs => {
            const link = document.createElement('a');
            link.download = `ktMmobile_개통신청서_${name}.jpg`;
            link.href = cvs.toDataURL('image/jpeg', 0.95);
            link.click();
        });
    }

    function resetForm() {
        if (confirm("입력한 내용을 모두 초기화하시겠습니까?")) {
            document.querySelectorAll('.typing-panel input').forEach(i => i.value = '');
            renderOverlay();
        }
    }
</script>

</body>
</html>
